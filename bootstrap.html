<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="text-center" style="color:#ff0381">Labvakar, world!</h1>
    <h4>Mācamies bootstrap</h4>
    <h1 class="display-1 text-center">Display 1</h1>

    <p class="lead fs-3">
        This is a lead <strong>paragraph</strong>. It stands out from regular paragraphs.
    </p>
    <p class="fs-1" style="color:#fff703">
        This is a lead <u>paragraph</u>. It stands out from regular paragraphs.
    </p>
    <h1>Bootstrap GRID</h1>

    <div class="row">
      <div class="col-md-2 col-xl-4">
        <img src="https://picsum.photos/400" alt="" width="100%">
      </div>
      <div class="col-md-8 col-xl-4">
           <p class="fs-3" style="color:#ff5703">
              This is a lead <u>paragraph</u>. It stands out from regular paragraphs.
          </p>
      </div>
      <div class="col-md-2 col-xl-4">
        <img src="https://picsum.photos/400" alt="" width="100%">
      </div>
    </div>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
